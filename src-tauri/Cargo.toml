[package]
name = "open-marketing"
version = "0.1.0-alpha.1"
description = "Open Marketing desktop agent store"
authors = ["Interflow contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "open_marketing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
