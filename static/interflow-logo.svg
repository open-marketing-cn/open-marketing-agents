  <circle cx="300" cy="480" r="108" fill="#ffd20a"/>
  <circle cx="1358" cy="250" r="124" fill="#08dfac"/>
  <circle cx="1512" cy="642" r="230" fill="#ff918d"/>
  <g fill="#fff" font-family="Arial Rounded MT Bold, Arial, PingFang SC, sans-serif" font-weight="700">
    <text x="500" y="425" font-size="210" letter-spacing="-15">inflow</text>
    <text x="640" y="558" font-size="195" letter-spacing="-12">ter</text>
