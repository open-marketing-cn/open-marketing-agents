name: Bug 报告
description: 报告目录、安装、更新、卸载或界面问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: observed
    attributes: { label: 实际发生了什么？ }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 你期望发生什么？ }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: 最小复现步骤 }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: macOS、Open Marketing 与 Codex 版本 }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 日志和截图已经删除 Token、真实账号、客户资料和本地用户名
          required: true
