name: 验证报告
description: 提交一个脱敏的真实营销任务验证
title: "[Validation] "
labels: ["validation"]
body:
  - type: input
    id: skill
    attributes: { label: Skill ID 与内容版本 }
    validations: { required: true }
  - type: input
    id: target
    attributes: { label: 目标工具与版本, placeholder: "Codex / Claude Code ..." }
    validations: { required: true }
  - type: input
    id: role
    attributes: { label: 验证者角色（脱敏） }
    validations: { required: true }
  - type: input
    id: industry
    attributes: { label: 行业或品类 }
    validations: { required: true }
  - type: textarea
    id: task
    attributes: { label: 测试任务和提供的脱敏资料 }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: 交付物是否有用？为什么？ }
    validations: { required: true }
  - type: input
    id: evidence
    attributes: { label: 脱敏案例证据链接 }
    validations: { required: true }
  - type: input
    id: attribution
    attributes: { label: 实践者署名（可匿名角色） }
    validations: { required: true }
  - type: textarea
    id: scenarios
    attributes: { label: 实际使用场景、适用边界和不适用反例 }
    validations: { required: true }
  - type: textarea
    id: depth
    attributes: { label: 从入门到进阶的玩法、踩坑和最佳实践 }
    validations: { required: true }
  - type: textarea
    id: remix
    attributes: { label: 二创改了什么、为什么改、与上游的边界 }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: 验证日期, placeholder: "YYYY-MM-DD" }
    validations: { required: true }
  - type: checkboxes
    id: permission
    attributes:
      label: 公开授权
      options:
        - label: 验证者允许公开以上脱敏角色、行业、任务、日期和结论
          required: true
